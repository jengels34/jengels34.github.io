<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadMe · Coming soon · Khakichimp</title>
<meta name="description" content="ReadMe — a native, privacy-first reading companion from Khakichimp. Coming soon.">
<style>
    :root{--bark:#3a2f23;--cream:#fbf6ea;--khaki:#c2a878;--banana:#ffcf3f;--coral:#ff6b54;--jungle:#4caa6a}
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 22px;
        color:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;
        background:radial-gradient(120% 120% at 50% 0%,#5a4a8a 0%,#3a2f5a 45%,#241d2e 100%);
    }
    ::selection{background:var(--banana);color:var(--bark)}
    .card{max-width:560px}
    .icon{font-size:3.4em}
    .mark{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.82em;letter-spacing:.04em;
        opacity:.85;margin-bottom:22px;text-transform:uppercase}
    .mark .dot{width:9px;height:9px;border-radius:50%;background:var(--banana)}
    .badge{display:inline-block;font-size:.74em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
        background:rgba(255,207,63,.16);color:var(--banana);padding:6px 14px;border-radius:999px;margin:18px 0 14px}
    h1{font-size:clamp(2.4em,9vw,3.6em);font-weight:800;letter-spacing:-0.03em}
    p{opacity:.85;font-size:1.08em;margin-top:12px}
    .links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
    a.btn{text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;transition:.2s;display:inline-flex;align-items:center;gap:7px}
    a.primary{background:var(--banana);color:var(--bark);box-shadow:0 10px 22px rgba(255,207,63,.3)}
    a.ghost{border:1px solid rgba(251,246,234,.28);color:var(--cream)}
    a.btn:hover{transform:translateY(-2px)}
    .float{display:inline-block;animation:float 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @media(prefers-reduced-motion:reduce){.float{animation:none}}
</style>
</head>
<body>
    <div class="card">
        <div class="mark"><span class="dot"></span> Khakichimp</div>
        <div class="icon float">📖</div>
        <div class="badge">Coming soon</div>
        <h1>ReadMe</h1>
        <p>A native reading companion in the works — built with the same privacy-first, on-device philosophy as every Khakichimp app. No trackers, no clutter, just your books.</p>
        <div class="links">
            <a class="btn primary" href="/khakichimp/">← Back to Khakichimp HQ</a>
            <a class="btn ghost" href="mailto:khakichimp@gmail.com">Get notified</a>
        </div>
    </div>
</body>
</html>
