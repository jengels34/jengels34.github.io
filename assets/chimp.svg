<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" class="ck-chimp" role="img" aria-label="Khakichimp — a friendly chimp in khaki cargo pants holding a banana">
  <style>
    .ck-chimp{display:block;overflow:visible}
    .ck-lids{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
    @media (prefers-reduced-motion: no-preference){
      .ck-torso{transform-box:fill-box;transform-origin:50% 100%;animation:ckBreathe 3.8s ease-in-out infinite}
      .ck-head{transform-box:fill-box;transform-origin:50% 96%;animation:ckHeadBob 4.8s ease-in-out infinite}
      .ck-lids{animation:ckBlink 5.4s ease-in-out infinite}
      .ck-ear-l{transform-box:fill-box;transform-origin:80% 60%;animation:ckEarL 6.2s ease-in-out infinite}
      .ck-ear-r{transform-box:fill-box;transform-origin:20% 60%;animation:ckEarR 6.9s ease-in-out infinite}
    }
    @keyframes ckBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
    @keyframes ckHeadBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-1.1deg)}}
    @keyframes ckBlink{0%,90%,100%{transform:scaleY(0)}94%,97%{transform:scaleY(1)}}
    @keyframes ckEarL{0%,88%,100%{transform:rotate(0deg)}93%{transform:rotate(-7deg)}}
    @keyframes ckEarR{0%,86%,100%{transform:rotate(0deg)}92%{transform:rotate(7deg)}}
  </style>

  <defs>
    <linearGradient id="ckFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2e1a"/>
      <stop offset="1" stop-color="#2b190d"/>
    </linearGradient>
    <linearGradient id="ckFurLimb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#583720"/>
      <stop offset="1" stop-color="#2f1c0e"/>
    </linearGradient>
    <radialGradient id="ckChest" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#a07d5b"/>
      <stop offset="1" stop-color="#6d5136"/>
    </radialGradient>
    <radialGradient id="ckFace" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#d9b18d"/>
      <stop offset="1" stop-color="#a9805a"/>
    </radialGradient>
    <linearGradient id="ckSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a70"/>
      <stop offset="1" stop-color="#9c7350"/>
    </linearGradient>
    <linearGradient id="ckKhaki" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc794"/>
      <stop offset="1" stop-color="#b49a63"/>
    </linearGradient>
    <linearGradient id="ckBanana" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e7b52d"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="305" rx="66" ry="10" fill="#000" opacity="0.13"/>

  <!-- ============ ARMS (behind torso; each group animates as one) ============ -->
  <!-- right arm: hangs at the side and does the wave (pivot ~148,162) -->
  <g class="ck-arm-r">
    <path d="M150,158 C172,168 182,190 180,214" fill="none" stroke="#24170d" stroke-width="31" stroke-linecap="round"/>
    <path d="M150,158 C172,168 182,190 180,214" fill="none" stroke="url(#ckFurLimb)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="180" cy="220" r="14.5" fill="url(#ckSkin)" stroke="#24170d" stroke-width="4.5"/>
    <path d="M187,214 q2,7 0,12 M180,213 q1,7 0,13" stroke="#7d5636" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- left arm: hangs at the side, presenting the banana upright in the fist -->
  <g class="ck-arm-l">
    <path d="M90,160 C74,168 64,182 60,196" fill="none" stroke="#24170d" stroke-width="31" stroke-linecap="round"/>
    <path d="M90,160 C74,168 64,182 60,196" fill="none" stroke="url(#ckFurLimb)" stroke-width="22" stroke-linecap="round"/>
    <!-- banana held upright, clear of the head -->
    <g transform="rotate(-9 60 190)">
      <path d="M52,196 C42,170 45,146 60,132 C65,132 69,135 70,140 C58,154 57,176 66,194 C62,198 56,199 52,196 Z" fill="url(#ckBanana)" stroke="#24170d" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M58,192 C52,172 53,152 64,140" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.5"/>
      <rect x="57" y="127" width="10" height="12" rx="3" fill="#7c611c" stroke="#24170d" stroke-width="3.2"/>
    </g>
    <!-- fist wrapping the banana -->
    <circle cx="60" cy="198" r="15" fill="url(#ckSkin)" stroke="#24170d" stroke-width="4.5"/>
    <path d="M53,192 q-2,7 0,12 M61,191 q-1,7 0,13 M69,194 q-1,6 0,11" stroke="#7d5636" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ============ TORSO ============ -->
  <g class="ck-torso">
    <path d="M86,150 C96,138 144,138 154,150 C164,166 166,190 160,212 L80,212 C74,190 76,166 86,150 Z" fill="url(#ckFur)" stroke="#24170d" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- bare chest + belly -->
    <path d="M120,150 C138,150 150,164 150,184 C150,202 138,210 120,210 C102,210 90,202 90,184 C90,164 102,150 120,150 Z" fill="url(#ckChest)"/>
    <!-- pec + ab shading -->
    <path d="M120,152 L120,206" stroke="#5c4229" stroke-width="2.2" opacity="0.5"/>
    <path d="M104,168 q16,9 0,16 M136,168 q-16,9 0,16" fill="none" stroke="#5c4229" stroke-width="2" opacity="0.45"/>
    <circle cx="107" cy="176" r="2.4" fill="#5c4229" opacity="0.6"/>
    <circle cx="133" cy="176" r="2.4" fill="#5c4229" opacity="0.6"/>
  </g>

  <!-- ============ PANTS (khaki cargo) ============ -->
  <g class="ck-pants">
    <path d="M82,204 C108,197 132,197 158,204 L161,240 C162,254 160,264 158,272 L128,272 C126,258 124,248 120,247 C116,248 114,258 112,272 L82,272 C80,264 78,254 79,240 Z" fill="url(#ckKhaki)" stroke="#24170d" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- fold shading -->
    <path d="M96,214 C94,232 96,250 100,266 M144,214 C146,232 144,250 140,266" fill="none" stroke="#9c8656" stroke-width="2.2" opacity="0.7" stroke-linecap="round"/>
    <!-- cargo pocket on the left leg -->
    <path d="M126,232 L150,232 L150,254 L126,254 Z" fill="none" stroke="#9c8656" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M126,238 L150,238" stroke="#9c8656" stroke-width="2.2"/>
    <!-- cuffs -->
    <path d="M83,262 L112,262 M128,262 L157,262" stroke="#9c8656" stroke-width="3.2" stroke-linecap="round"/>
    <!-- belt -->
    <path d="M81,201 C108,194 132,194 159,201 L159,214 C132,207 108,207 81,214 Z" fill="#5a3d24" stroke="#24170d" stroke-width="5" stroke-linejoin="round"/>
    <rect x="111" y="198" width="18" height="14" rx="3.5" fill="#c9ccd2" stroke="#24170d" stroke-width="3.6"/>
    <rect x="116.5" y="201.5" width="7" height="7" rx="1.5" fill="#5a3d24"/>
  </g>

  <!-- ============ FEET ============ -->
  <g class="ck-feet">
    <ellipse cx="100" cy="282" rx="22" ry="12" fill="url(#ckSkin)" stroke="#24170d" stroke-width="5"/>
    <ellipse cx="140" cy="282" rx="22" ry="12" fill="url(#ckSkin)" stroke="#24170d" stroke-width="5"/>
    <path d="M93,274 q0,5 0,8 M102,273 q0,5 0,8 M111,274 q0,5 0,8 M133,274 q0,5 0,8 M142,273 q0,5 0,8 M151,274 q0,5 0,8" stroke="#7d5636" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ============ HEAD ============ -->
  <g class="ck-head">
    <g class="ck-ear-l">
      <circle cx="50" cy="88" r="26" fill="url(#ckFur)" stroke="#24170d" stroke-width="5.5"/>
      <circle cx="54" cy="88" r="13" fill="url(#ckSkin)"/>
    </g>
    <g class="ck-ear-r">
      <circle cx="190" cy="88" r="26" fill="url(#ckFur)" stroke="#24170d" stroke-width="5.5"/>
      <circle cx="186" cy="88" r="13" fill="url(#ckSkin)"/>
    </g>

    <!-- skull -->
    <ellipse cx="120" cy="90" rx="72" ry="70" fill="url(#ckFur)" stroke="#24170d" stroke-width="5.5"/>
    <!-- crown tufts -->
    <path d="M96,26 C98,14 108,12 112,22 C117,11 127,13 128,25 C134,20 143,24 142,34 C126,26 112,26 96,34 Z" fill="url(#ckFur)" stroke="#24170d" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- face patch -->
    <path d="M120,52 C110,44 92,47 84,62 C70,70 62,90 66,110 C70,134 92,152 120,152 C148,152 170,134 174,110 C178,90 170,70 156,62 C148,47 130,44 120,52 Z" fill="url(#ckFace)"/>

    <!-- brow ridge -->
    <path d="M84,74 C94,66 110,66 118,74 M122,74 C130,66 146,66 156,74" fill="none" stroke="#8a6544" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

    <g class="ck-eyes">
      <ellipse cx="100" cy="88" rx="12.5" ry="13.5" fill="#ffffff" stroke="#24170d" stroke-width="3"/>
      <ellipse cx="140" cy="88" rx="12.5" ry="13.5" fill="#ffffff" stroke="#24170d" stroke-width="3"/>
      <g class="ck-pupils">
        <g class="ck-eye-in">
          <circle cx="101" cy="89" r="7" fill="#6b3f16"/>
          <circle cx="101" cy="89" r="3.4" fill="#22150b"/>
          <circle cx="98.5" cy="86" r="2.4" fill="#fff"/>
        </g>
        <g class="ck-eye-in">
          <circle cx="139" cy="89" r="7" fill="#6b3f16"/>
          <circle cx="139" cy="89" r="3.4" fill="#22150b"/>
          <circle cx="136.5" cy="86" r="2.4" fill="#fff"/>
        </g>
      </g>
      <g class="ck-lids" fill="#c99a70" transform="scale(1 0.0001)">
        <ellipse cx="100" cy="88" rx="13.4" ry="14.4"/>
        <ellipse cx="140" cy="88" rx="13.4" ry="14.4"/>
      </g>
    </g>

    <!-- muzzle -->
    <ellipse cx="120" cy="120" rx="34" ry="26" fill="#d8b48c" opacity="0.55"/>
    <!-- nostrils -->
    <ellipse cx="113" cy="114" rx="2.7" ry="3.6" fill="#3a2414"/>
    <ellipse cx="127" cy="114" rx="2.7" ry="3.6" fill="#3a2414"/>
    <!-- mouth -->
    <path class="ck-mouth" d="M101,126 C110,139 130,139 139,126" stroke="#3a2414" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- gray goatee -->
    <path d="M108,138 C112,150 128,150 132,138 C129,146 111,146 108,138 Z" fill="#d8d2c8" stroke="#b7b0a2" stroke-width="1.6"/>
  </g>
</svg>
