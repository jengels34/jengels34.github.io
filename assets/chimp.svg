<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" class="ck-chimp" role="img" aria-label="Khakichimp — a friendly cartoon chimp in khaki pants">
  <style>
    .ck-chimp{display:block;overflow:visible}
    .ck-lids{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
    @media (prefers-reduced-motion: no-preference){
      .ck-torso{transform-box:fill-box;transform-origin:50% 100%;animation:ckBreathe 3.8s ease-in-out infinite}
      .ck-head{transform-box:fill-box;transform-origin:50% 96%;animation:ckHeadBob 4.8s ease-in-out infinite}
      .ck-lids{animation:ckBlink 5.4s ease-in-out infinite}
      .ck-ear-l{transform-box:fill-box;transform-origin:80% 60%;animation:ckEarL 6.2s ease-in-out infinite}
      .ck-ear-r{transform-box:fill-box;transform-origin:20% 60%;animation:ckEarR 6.9s ease-in-out infinite}
    }
    @keyframes ckBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
    @keyframes ckHeadBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-1.1deg)}}
    @keyframes ckBlink{0%,90%,100%{transform:scaleY(0)}94%,97%{transform:scaleY(1)}}
    @keyframes ckEarL{0%,88%,100%{transform:rotate(0deg)}93%{transform:rotate(-7deg)}}
    @keyframes ckEarR{0%,86%,100%{transform:rotate(0deg)}92%{transform:rotate(7deg)}}
  </style>

  <!-- ground shadow -->
  <ellipse cx="120" cy="302" rx="64" ry="10" fill="#000" opacity="0.12"/>

  <!-- arms (behind torso so shoulder caps stay hidden; each group waves as one) -->
  <g class="ck-arm-l">
    <path d="M94,162 C72,172 62,192 62,218" fill="none" stroke="#3a2414" stroke-width="30" stroke-linecap="round"/>
    <path d="M94,162 C72,172 62,192 62,218" fill="none" stroke="#7b5134" stroke-width="20" stroke-linecap="round"/>
    <circle cx="62" cy="222" r="14.5" fill="#f4c995" stroke="#3a2414" stroke-width="5"/>
    <!-- banana held up in front of the left fist -->
    <g transform="rotate(10 62 222)">
      <path d="M68,226 C50,222 40,204 44,184 L53,186 C52,202 58,212 70,217 Z" fill="#ffd34e" stroke="#3a2414" stroke-width="4.5" stroke-linejoin="round"/>
      <rect x="43" y="176" width="9" height="10" rx="2.5" fill="#8a6d1f" stroke="#3a2414" stroke-width="3.5"/>
    </g>
    <path d="M55,218 q-2,6 0,11 M63,217 q-1,6 0,12" stroke="#dba76c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <g class="ck-arm-r">
    <path d="M146,162 C168,172 178,192 178,218" fill="none" stroke="#3a2414" stroke-width="30" stroke-linecap="round"/>
    <path d="M146,162 C168,172 178,192 178,218" fill="none" stroke="#7b5134" stroke-width="20" stroke-linecap="round"/>
    <circle cx="178" cy="222" r="14.5" fill="#f4c995" stroke="#3a2414" stroke-width="5"/>
    <path d="M185,216 q2,7 0,12 M178,215 q1,7 0,13" stroke="#dba76c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- torso -->
  <g class="ck-torso">
    <path d="M88,152 C96,142 144,142 152,152 C160,166 162,186 158,206 L82,206 C78,186 80,166 88,152 Z" fill="#7b5134" stroke="#3a2414" stroke-width="5.5" stroke-linejoin="round"/>
    <ellipse cx="120" cy="182" rx="25" ry="24" fill="#f4c995"/>
  </g>

  <!-- pants -->
  <g class="ck-pants">
    <path d="M84,200 C108,194 132,194 156,200 L159,234 C160,248 159,258 157,266 L127,266 C125,252 123,244 120,243 C117,244 115,252 113,266 L83,266 C81,258 80,248 81,234 Z" fill="#d9c18c" stroke="#3a2414" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- cuffs -->
    <path d="M84,256 L112,256 M128,256 L156,256" stroke="#b39a62" stroke-width="3.5" stroke-linecap="round"/>
    <!-- pockets -->
    <path d="M88,212 q8,8 18,7 M152,212 q-8,8 -18,7" stroke="#b39a62" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- belt -->
    <path d="M83,197 C108,190 132,190 157,197 L157,211 C132,204 108,204 83,211 Z" fill="#7a5c3a" stroke="#3a2414" stroke-width="5" stroke-linejoin="round"/>
    <rect x="111" y="194" width="18" height="13.5" rx="3.5" fill="#f0b94f" stroke="#3a2414" stroke-width="4"/>
    <rect x="116.5" y="197.5" width="7" height="6.5" rx="1.5" fill="#7a5c3a"/>
  </g>

  <!-- feet -->
  <g class="ck-feet">
    <ellipse cx="98" cy="276" rx="21" ry="12" fill="#f4c995" stroke="#3a2414" stroke-width="5"/>
    <ellipse cx="142" cy="276" rx="21" ry="12" fill="#f4c995" stroke="#3a2414" stroke-width="5"/>
    <path d="M92,268 q0,5 0,8 M101,267 q0,5 0,8 M136,267 q0,5 0,8 M145,268 q0,5 0,8" stroke="#dba76c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ============ HEAD ============ -->
  <g class="ck-head">
    <g class="ck-ear-l">
      <circle cx="52" cy="86" r="25" fill="#7b5134" stroke="#3a2414" stroke-width="5.5"/>
      <circle cx="55" cy="86" r="12" fill="#dba76c"/>
    </g>
    <g class="ck-ear-r">
      <circle cx="188" cy="86" r="25" fill="#7b5134" stroke="#3a2414" stroke-width="5.5"/>
      <circle cx="185" cy="86" r="12" fill="#dba76c"/>
    </g>

    <!-- skull -->
    <ellipse cx="120" cy="92" rx="70" ry="66" fill="#7b5134" stroke="#3a2414" stroke-width="5.5"/>
    <!-- hair tuft -->
    <path d="M108,31 C107,19 115,12 120,21 C124,12 133,16 131,29 C124,23 115,24 108,31 Z" fill="#7b5134" stroke="#3a2414" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- face patch -->
    <path d="M120,60 C112,52 96,54 88,66 C74,72 64,88 67,106 C70,128 90,144 120,144 C150,144 170,128 173,106 C176,88 166,72 152,66 C144,54 128,52 120,60 Z" fill="#f4c995"/>

    <g class="ck-eyes">
      <ellipse cx="100" cy="88" rx="12.5" ry="13.5" fill="#ffffff" stroke="#3a2414" stroke-width="3"/>
      <ellipse cx="140" cy="88" rx="12.5" ry="13.5" fill="#ffffff" stroke="#3a2414" stroke-width="3"/>
      <g class="ck-pupils">
        <g class="ck-eye-in">
          <circle cx="101" cy="89" r="6.6" fill="#2a1a10"/>
          <circle cx="98.5" cy="86" r="2.4" fill="#fff"/>
        </g>
        <g class="ck-eye-in">
          <circle cx="139" cy="89" r="6.6" fill="#2a1a10"/>
          <circle cx="136.5" cy="86" r="2.4" fill="#fff"/>
        </g>
      </g>
      <g class="ck-lids" fill="#f4c995" transform="scale(1 0.0001)">
        <ellipse cx="100" cy="88" rx="13.4" ry="14.4"/>
        <ellipse cx="140" cy="88" rx="13.4" ry="14.4"/>
      </g>
    </g>

    <!-- cheeks -->
    <circle cx="86" cy="108" r="6" fill="#ef9a6d" opacity="0.55"/>
    <circle cx="154" cy="108" r="6" fill="#ef9a6d" opacity="0.55"/>

    <!-- nose + mouth -->
    <ellipse cx="114" cy="109" rx="2.6" ry="3.4" fill="#3a2414"/>
    <ellipse cx="126" cy="109" rx="2.6" ry="3.4" fill="#3a2414"/>
    <path class="ck-mouth" d="M101,118 C109,131 131,131 139,118" stroke="#3a2414" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
