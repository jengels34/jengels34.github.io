<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" class="ck-chimp" role="img" aria-label="Khakichimp — a cartoon chimp in khaki pants">
  <style>
    .ck-chimp{--fur:#6e4a33;--fur-d:#4d3522;--fur-l:#875f3e;
      --skin:#c89464;--skin-l:#dcab78;--skin-d:#a9774b;
      --ear-in:#a76b4e;--belly:#caa06f;
      --eyew:#f6efe2;--iris:#5a3c25;--pupil:#241710;
      --pants:#bdac72;--pants-l:#d4c692;--pants-d:#9a8b50;--belt:#8c7c43;--btn:#6c6131;--stitch:#e7dcab;
      --mouth:#5a3622}
    .ck-chimp{display:block;overflow:visible}
    /* eyelids hidden by default (open eyes); blink animation drops them */
    .ck-lids{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
    @media (prefers-reduced-motion: no-preference){
      .ck-torso{transform-box:fill-box;transform-origin:50% 100%;animation:ckBreathe 3.8s ease-in-out infinite}
      .ck-head{transform-box:fill-box;transform-origin:50% 92%;animation:ckHeadBob 4.8s ease-in-out infinite}
      .ck-lids{animation:ckBlink 5.4s ease-in-out infinite}
      .ck-ear-l{transform-box:fill-box;transform-origin:82% 50%;animation:ckEarL 6.2s ease-in-out infinite}
      .ck-ear-r{transform-box:fill-box;transform-origin:18% 50%;animation:ckEarR 6.9s ease-in-out infinite}
    }
    @keyframes ckBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
    @keyframes ckHeadBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-1.2deg)}}
    @keyframes ckBlink{0%,90%,100%{transform:scaleY(0)}94%,97%{transform:scaleY(1)}}
    @keyframes ckEarL{0%,88%,100%{transform:rotate(0deg)}93%{transform:rotate(-7deg)}}
    @keyframes ckEarR{0%,86%,100%{transform:rotate(0deg)}92%{transform:rotate(7deg)}}
  </style>

  <!-- soft ground shadow -->
  <ellipse cx="120" cy="291" rx="74" ry="9" fill="#000" opacity="0.16"/>

  <!-- feet -->
  <g class="ck-feet" fill="var(--skin-d)">
    <ellipse cx="98" cy="285" rx="26" ry="11"/>
    <ellipse cx="142" cy="285" rx="26" ry="11"/>
    <ellipse cx="98" cy="283" rx="22" ry="8" fill="var(--skin)"/>
    <ellipse cx="142" cy="283" rx="22" ry="8" fill="var(--skin)"/>
  </g>

  <!-- arms (behind torso) -->
  <g class="ck-arm-l" fill="var(--fur)">
    <path d="M82,128 C58,140 44,176 46,206 C47,222 71,222 73,206 C76,176 86,150 96,140 Z"/>
  </g>
  <g class="ck-arm-r" fill="var(--fur)">
    <path d="M158,128 C182,140 196,176 194,206 C193,222 169,222 167,206 C164,176 154,150 144,140 Z"/>
  </g>

  <!-- torso -->
  <g class="ck-torso">
    <path d="M76,126 C82,112 158,112 164,126 C176,150 170,186 152,196 C132,206 108,206 88,196 C70,186 64,150 76,126 Z" fill="var(--fur)"/>
    <ellipse cx="120" cy="158" rx="32" ry="34" fill="var(--belly)"/>
  </g>

  <!-- pants -->
  <g class="ck-pants">
    <path d="M78,168 C100,162 140,162 162,168 L158,200 L150,286 L126,286 L120,222 L114,286 L90,286 L82,200 Z" fill="var(--pants)"/>
    <path d="M82,200 L90,286 L100,286 L94,200 Z" fill="var(--pants-l)" opacity="0.55"/>
    <path d="M146,200 L150,286 L140,286 L138,200 Z" fill="var(--pants-d)" opacity="0.45"/>
    <path d="M88,278 L152,278 L150,286 L90,286 Z" fill="var(--pants-d)" opacity="0.5"/>
    <path d="M78,166 C100,160 140,160 162,166 L162,182 C140,176 100,176 78,182 Z" fill="var(--belt)"/>
    <rect x="92" y="163" width="6" height="20" rx="2" fill="var(--pants-d)"/>
    <rect x="142" y="163" width="6" height="20" rx="2" fill="var(--pants-d)"/>
    <circle cx="120" cy="174" r="4" fill="var(--btn)"/>
    <path d="M120,180 L120,210" stroke="var(--pants-d)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M88,188 C96,196 104,198 110,196" stroke="var(--stitch)" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M152,188 C144,196 136,198 130,196" stroke="var(--stitch)" stroke-width="1.6" fill="none" opacity="0.7"/>
  </g>

  <!-- hands (in front of thighs) -->
  <g class="ck-hand-l" fill="var(--skin)">
    <ellipse cx="58" cy="208" rx="15" ry="17"/>
    <path d="M48,200 q-4,8 1,16 M56,196 q-2,9 0,18 M64,197 q1,9 -1,17" stroke="var(--skin-d)" stroke-width="1.4" fill="none" opacity="0.6"/>
  </g>
  <g class="ck-hand-r" fill="var(--skin)">
    <ellipse cx="182" cy="208" rx="15" ry="17"/>
    <path d="M192,200 q4,8 -1,16 M184,196 q2,9 0,18 M176,197 q-1,9 1,17" stroke="var(--skin-d)" stroke-width="1.4" fill="none" opacity="0.6"/>
  </g>

  <!-- ============ HEAD ============ -->
  <g class="ck-head">
    <g class="ck-ear-l">
      <ellipse cx="64" cy="70" rx="20" ry="24" fill="var(--fur)"/>
      <ellipse cx="67" cy="70" rx="11" ry="15" fill="var(--ear-in)"/>
    </g>
    <g class="ck-ear-r">
      <ellipse cx="176" cy="70" rx="20" ry="24" fill="var(--fur)"/>
      <ellipse cx="173" cy="70" rx="11" ry="15" fill="var(--ear-in)"/>
    </g>

    <path d="M104,22 l6,12 l8,-12 l8,12 l8,-12 l6,12 C124,18 116,18 104,22 Z" fill="var(--fur-d)"/>

    <ellipse cx="120" cy="70" rx="58" ry="54" fill="var(--fur)"/>
    <path d="M120,40 C152,40 166,66 164,90 C162,116 144,128 120,128 C96,128 78,116 76,90 C74,66 88,40 120,40 Z" fill="var(--skin)"/>

    <path d="M86,64 C98,56 112,56 120,60 C128,56 142,56 154,64 C146,62 132,64 120,66 C108,64 94,62 86,64 Z" fill="var(--skin-d)" opacity="0.55"/>

    <g class="ck-eyes">
      <ellipse cx="103" cy="76" rx="12.5" ry="13.5" fill="var(--eyew)"/>
      <ellipse cx="137" cy="76" rx="12.5" ry="13.5" fill="var(--eyew)"/>
      <g class="ck-pupils" style="transform-box:fill-box;transform-origin:50% 50%">
        <g class="ck-eye-in">
          <circle cx="105" cy="78" r="6.5" fill="var(--iris)"/>
          <circle cx="105" cy="78" r="3.1" fill="var(--pupil)"/>
          <circle cx="102" cy="74.5" r="2.1" fill="#fff"/>
        </g>
        <g class="ck-eye-in">
          <circle cx="135" cy="78" r="6.5" fill="var(--iris)"/>
          <circle cx="135" cy="78" r="3.1" fill="var(--pupil)"/>
          <circle cx="132" cy="74.5" r="2.1" fill="#fff"/>
        </g>
      </g>
      <g class="ck-lids" fill="var(--skin)">
        <ellipse cx="103" cy="76" rx="13.2" ry="14.2"/>
        <ellipse cx="137" cy="76" rx="13.2" ry="14.2"/>
      </g>
    </g>

    <ellipse cx="120" cy="106" rx="30" ry="22" fill="var(--skin-l)"/>
    <ellipse cx="113" cy="100" rx="2.6" ry="3.4" fill="var(--mouth)" opacity="0.8"/>
    <ellipse cx="127" cy="100" rx="2.6" ry="3.4" fill="var(--mouth)" opacity="0.8"/>
    <path class="ck-mouth" d="M102,112 C110,124 130,124 138,112" stroke="var(--mouth)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
