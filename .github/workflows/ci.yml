name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate HTML & links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check internal links
        run: npm run check:links

      - name: Validate HTML (htmlhint)
        run: npx --yes htmlhint@1 "**/*.html" --ignore "node_modules/**"
